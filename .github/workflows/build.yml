name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 유니버설(인텔 + 애플 실리콘) 빌드
        run: ARCHS="x86_64 arm64" bash scripts/build-app.sh

      - name: 에러 요약
        if: failure()
        run: grep -E "error:" build/build.log | head -50 || true

      - name: 결과 확인 (인텔 포함, 위젯 포함)
        run: |
          lipo -archs build/TouchForge.app/Contents/MacOS/TouchForge | grep -q x86_64
          ls build/TouchForge.app/Contents/PlugIns/TouchForgeWidget.appex

      - name: zip 으로 묶기
        run: cd build && ditto -c -k --keepParent TouchForge.app TouchForge.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TouchForge
          path: build/TouchForge.zip

      - name: 태그면 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TouchForge.zip
